name: CI

# Build PanIsoGuard and run the unit suite on every push / PR to main, on Linux
# and macOS. htslib (>= 1.18) and the C/C++ toolchain are installed from
# conda-forge/bioconda via micromamba — the same dependency path users get with
# `conda install`. A separate job lints the bioconda recipe.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up toolchain + htslib (micromamba)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: build
          init-shell: bash
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
              - bioconda
          create-args: >-
            cxx-compiler
            c-compiler
            cmake>=3.20
            make
            pkg-config
            htslib>=1.18
            zlib
            python>=3.8
            samtools>=1.18

      - name: Configure
        shell: bash -el {0}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"

      - name: Build
        shell: bash -el {0}
        run: cmake --build build -j

      - name: Test
        shell: bash -el {0}
        run: ctest --test-dir build --output-on-failure

      - name: Smoke
        shell: bash -el {0}
        run: ./build/panisoguard --version

      - name: Verify benchmark result artifacts (no metric drift / schema-valid)
        shell: bash -el {0}
        run: python3 benchmark/results/collect.py --pig ./build/panisoguard --check

  recipe-lint:
    name: bioconda recipe lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up bioconda-utils (micromamba)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: lint
          init-shell: bash
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
              - bioconda
          create-args: >-
            bioconda-utils

      - name: Lint recipe with bioconda-utils
        shell: bash -el {0}
        run: |
          set -euo pipefail
          # bioconda-utils expects the recipe under recipes/<package-name>/.
          mkdir -p work/recipes/panisoguard
          cp recipes/bioconda/meta.yaml recipes/bioconda/build.sh work/recipes/panisoguard/
          curl -fsSL https://raw.githubusercontent.com/bioconda/bioconda-recipes/master/config.yml \
            -o work/config.yml
          touch work/build-fail-blacklist
          cd work
          git init -q
          git -c user.email=ci@example.com -c user.name=ci add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm init
          bioconda-utils lint recipes config.yml --packages panisoguard
