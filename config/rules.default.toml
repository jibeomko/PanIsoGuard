# PanIsoGuard default adjudication rules (auditable, runtime-loaded).
#
# This file makes the decision logic inspectable: the tunable thresholds below
# are read by the rule engine, and the (novelty-support x mechanism) -> class
# projection is documented in docs/decision_engine.md and echoed per-isoform in
# the `rule_trace` field of <prefix>.attribution.jsonl.
#
# Status: the adjudication logic is validated against ground truth (SQANTI-SIM
# AUPRC 0.970 vs 0.831 baseline; well-calibrated, ECE/Brier <= 0.013 -- see
# docs/validation.md). The thresholds below are conservative defaults; a SQANTI-SIM
# v49 chr22 sweep (benchmark/results/sqanti_sim/sweep.tsv) finds AUPRC robust
# (0.969-0.970) across the grid and the default within 1e-4 of grid-best -- near-optimal
# there, though not yet swept on additional datasets. Treat the confidence classes as
# calibrated ordinal evidence, not a tuned probability. The pangenome (reference-bias)
# tier remains experimental pending GATE-1. Framing constraint: PanIsoGuard reports
# orthogonal attribution + confidence + provenance, never "beats" the SQANTI3 RF
# filter or FLAIR2.

[meta]
ruleset_version        = "default-0.0.1"
sqanti3_version_target = "6.0"   # QC-prior reconciliation target; pin & cite
random_seed            = 1

# --- Axis A: novelty support (engine-read) -----------------------------------
[axis_novelty_support]
sj_min_uniq_reads          = 3      # STAR SJ.tab n_uniq to corroborate a novel junction
sj_require_canonical_motif = true   # require SJ.tab motif code >= 1
consensus_min_callers      = 999    # RESERVED: parsed but NOT yet consumed by the rule
                                    # engine (multi-caller agreement gate unimplemented)

# --- Axis B: artifact mechanism (engine-read where noted) --------------------
# Priority order applied by the engine: mapping > noncanonical > rt_switch > degradation.
[axis_artifact.degradation]
max_perc_A_downstream_TTS = 60.0    # SQANTI3 intra-priming default: keep <60, flag >=60 (engine-read)

# The rt_switch / noncanonical toggles below are INFORMATIONAL ONLY: the engine
# always consults the corresponding SQANTI prior (RTS_stage / all_canonical), and
# these keys are NOT read from TOML. The on/off switch lives in the built-in
# RuleConfig and is flipped only by `ablate` (--axes rt_switch / noncanonical).
[axis_artifact.rt_switch]
use_sqanti_RTS_stage = true         # informational (engine always uses SQANTI RTS_stage)

[axis_artifact.noncanonical]
use_sqanti_all_canonical = true     # informational (engine always uses SQANTI all_canonical)

[axis_artifact.mapping]             # BAM read-level axis (engine-read; only when --bam supplied)
min_mapq               = 20         # spanning reads below this MAPQ count as low-confidence
softclip_min_bp        = 20         # terminal soft-clip >= this counts toward the soft-clip fraction (reported-only*)
junction_window_bp     = 10         # indel proximity window around each splice boundary (reported-only*)
max_low_mapq_frac      = 0.5        # > this fraction of low-MAPQ spanning reads -> mapping artifact
max_supplementary_frac = 0.5        # > this fraction supplementary/secondary -> mapping artifact
# *The mapping_flag gate uses only low_mapq_frac / supplementary_frac. The soft-clip
#  and indel-near fractions are computed and emitted to attribution.jsonl for
#  inspection, but do not yet contribute to the mapping mechanism decision.

# --- Reference-bias rescue: pangenome (engine-read; only when --pangenome-junctions supplied)
# When ALL of an isoform's novel-vs-linear-reference junctions are realizable on a
# pangenome graph haplotype path, the apparent novelty is consistent with reference
# bias. This is independent (non-circular) evidence ONLY if the junction set comes
# from population assemblies; PanIsoGuard cannot verify the file, so it applies the
# same circularity firewall as the variant axis (--pangenome-provenance: population/
# external promote; sample_derived/unknown are held AMBIGUOUS). Experimental: not yet
# validated on real graph data (see GATE-1 in docs/decision_engine.md).
[axis_pangenome]
min_haplotypes = 1                  # >= this many graph haplotypes must carry a junction (1 = a single path)

# --- Confidence classes ------------------------------------------------------
# Output classes (ordinal within the novel tiers). PAN_REF_RESCUED_FALSE_NOVEL is
# emitted only when the variant axis (--reference-haplotype) or the pangenome axis
# (--pangenome-junctions) is supplied; without them the run stays in the Tier-0
# grid (no rescue class).
[confidence]
classes = [
  "HIGH_CONF_KNOWN",
  "HIGH_CONF_NOVEL",
  "MEDIUM_CONF_NOVEL",
  "LOW_CONF_PARTIAL",
  "PAN_REF_RESCUED_FALSE_NOVEL",      # reference bias: explained by a personalized haplotype
                                      # (variant axis) or a pangenome graph path (pangenome axis)
  "AMBIGUOUS",
  "ARTIFACT",
]

# Projection grid implemented in src/core/rules.cpp (v1) and documented in
# docs/decision_engine.md:
#   SUPPORTED   x none      -> HIGH_CONF_NOVEL
#   SUPPORTED   x mechanism -> MEDIUM_CONF_NOVEL
#   PARTIAL     x none      -> MEDIUM_CONF_NOVEL
#   PARTIAL     x mechanism -> LOW_CONF_PARTIAL
#   UNSUPPORTED x none      -> LOW_CONF_PARTIAL
#   UNSUPPORTED x mechanism -> ARTIFACT
#   UNKNOWN (support not evaluable) -> AMBIGUOUS
# Moving the full grid into this file (table-driven projection) is a planned
# refinement.
