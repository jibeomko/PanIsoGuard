# PanIsoGuard default adjudication rules (auditable, runtime-loaded).
#
# This file makes the decision logic inspectable: the tunable thresholds below
# are read by the rule engine, and the (novelty-support x mechanism) -> class
# projection is documented in docs/decision_engine.md and echoed per-isoform in
# the `rule_trace` field of <prefix>.attribution.jsonl.
#
# Status: the thresholds below are conservative defaults. A SQANTI-SIM v49 chr22 sweep
# (benchmark/results/sqanti_sim/sweep.tsv) finds AUPRC flat (0.970-0.971) across the grid,
# but on the same truth set PanIsoGuard is not more accurate than a one-line short-read
# rule (benchmark/sqanti3_filter_h2h); see docs/validation.md. The confidence classes are
# labels, not an ordered scale or a probability. Every run writes the effective thresholds
# to <prefix>.provenance.log.

[meta]
ruleset_version        = "default-0.0.6"   # bump together with the built-in in rules.hpp
sqanti3_version_target = "6.0"   # QC-prior reconciliation target; pin & cite

# --- Axis A: novelty support (engine-read) -----------------------------------
[axis_novelty_support]
sj_min_uniq_reads          = 3      # STAR SJ.tab n_uniq to corroborate a novel junction
sj_require_canonical_motif = true   # require SJ.tab motif code >= 1
consensus_min_callers      = 2      # a novel chain recovered by >= this many callers is
                                    # consensus-supported; consumed by evaluate() when
                                    # --caller-support (a `combine` matrix) is supplied and
                                    # short-read support is UNKNOWN (promotes to MEDIUM, never
                                    # HIGH). Matches the built-in default; raise to disable.

# --- Axis B: artifact mechanism (engine-read where noted) --------------------
# Priority order applied by the engine: mapping > noncanonical > rt_switch > degradation.
[axis_artifact.degradation]
max_perc_A_downstream_TTS = 60.0    # SQANTI3 intra-priming default: keep <60, flag >=60 (engine-read).
                                    # Since 0.0.6 the sign also needs NO polyA motif upstream of the 3' end
                                    # (SQANTI3's polyA_motif_found, present when it ran with a motif list);
                                    # 20-30 % of perc_A-flagged ends carry a motif and are kept.

# rt_switch and noncanonical have no thresholds: the engine reads SQANTI3's RTS_stage and
# all_canonical columns as they are.

[axis_artifact.mapping]             # BAM read-level axis (engine-read; only when --bam supplied)
min_mapq               = 20         # spanning reads below this MAPQ count as low-confidence
min_spanning           = 3          # a junction's read fractions count only with >= this many spanning reads;
                                    #   with 1-2 reads one indel is a fraction of 1.0 (45 % of HG03516's
                                    #   mapping-artifact calls rested on < 3 reads before 0.0.6)
junction_window_bp     = 10         # indel proximity window around each splice boundary
max_low_mapq_frac      = 0.5        # > this fraction of low-MAPQ spanning reads -> mapping artifact
max_supplementary_frac = 0.5        # > this fraction supplementary/secondary -> mapping artifact
max_indel_near_frac    = 0.5        # > this fraction with an indel adjacent to the junction -> mapping artifact
                                    #   (an alignment-ambiguous indel mis-rendered as an intron; junction-proximal,
                                    #    catches 14/124 false novel junctions at 100% precision with min_spanning=3 -- benchmark/bam_axis)
# Mapping mechanism = OR of low_mapq / supplementary / indel_near.

# --- Whole-chain long-read support (engine-read; only when --bam supplied) ----------------
# Reads whose alignment carries the isoform's entire intron chain (exact coordinates, primary
# alignments). They are the caller's own reads, so this is methodological corroboration like
# caller consensus: when short-read support is UNKNOWN (no SJ.tab, or a NIC isoform with no
# novel junction to test) and no artifact sign is present, >= min_full_reads lifts the call
# to NOVEL_PROBABLE (never CONFIRMED). On SQANTI-SIM chr22 it keeps 151/151 genuine held NIC
# isoforms and 0/6 false ones for FLAIR, but Bambu/ESPRESSO/TALON's false chains are read-
# supported too (alignment-level artifacts): see benchmark/chain_support before relying on it.
[axis_chain]
min_full_reads = 3

# --- Reference-bias rescue: pangenome (engine-read; only when --pangenome-junctions supplied)
# When ALL of an isoform's novel-vs-linear-reference junctions are realizable on ONE
# pangenome graph haplotype path (path ids are an optional 6th column; without them the
# per-junction counts decide), the apparent novelty is consistent with reference
# bias. The haplotype axis applies the same rule: one haplotype must carry every junction. This is independent (non-circular) evidence ONLY if the junction set comes
# from population assemblies; PanIsoGuard cannot verify the file, so it applies the
# same circularity firewall as the variant axis (--pangenome-provenance: population/
# external promote; sample_derived/unknown are held AMBIGUOUS). Experimental: not yet
# validated on real graph data (see GATE-1 in docs/decision_engine.md).
[axis_pangenome]
min_haplotypes = 1                  # >= this many graph haplotypes must carry a junction (1 = a single path)

# --- Confidence classes ------------------------------------------------------
# Output classes (names say the verdict; the evidence is in verdict_reason and rule_trace).
# REFERENCE_BIAS is emitted only when the variant axis (--reference-haplotype) or the
# pangenome axis (--pangenome-junctions) is supplied. Names before 0.0.6: KNOWN was
# HIGH_CONF_KNOWN, NOVEL_CONFIRMED HIGH_CONF_NOVEL, NOVEL_PROBABLE MEDIUM_CONF_NOVEL,
# UNCONFIRMED LOW_CONF_PARTIAL, UNRESOLVED AMBIGUOUS, REFERENCE_BIAS PAN_REF_RESCUED_FALSE_NOVEL.
[confidence]
classes = [
  "KNOWN",
  "KNOWN_FRAGMENT",                   # ISM carried end to end by >= min_full_reads long reads, no intra-priming sign
  "NOVEL_CONFIRMED",
  "NOVEL_PROBABLE",
  "UNCONFIRMED",
  "UNRESOLVED",
  "REFERENCE_BIAS",                   # explained by a personalized haplotype (variant axis)
                                      # or a pangenome graph path (pangenome axis)
  "ARTIFACT",
]

# Projection grid implemented in src/core/rules.cpp and documented in
# docs/decision_engine.md (verdict / verdict_reason in parentheses):
#   SUPPORTED   x none      -> NOVEL_CONFIRMED (confirmed / all_junctions_supported)
#   SUPPORTED   x mechanism -> NOVEL_PROBABLE  (confirmed / supported_with_<mechanism>)
#   PARTIAL     x any       -> UNCONFIRMED     (unconfirmed / partial_support[_with_<mechanism>])
#   UNSUPPORTED x none      -> UNCONFIRMED     (unconfirmed / unsupported_no_sign)
#   UNSUPPORTED x mechanism -> ARTIFACT        (artifact / unsupported_<mechanism>)
#   UNKNOWN     x mapping   -> UNCONFIRMED     (unconfirmed / mapping_without_short_reads)
#   UNKNOWN + >= consensus_min_callers x none -> NOVEL_PROBABLE (confirmed / caller_consensus)
#   UNKNOWN + consensus x mechanism -> UNCONFIRMED (unconfirmed / consensus_with_<mechanism>)
#     (consensus counts only for a chain that joined AND was checked against --ref-gtf)
#   UNKNOWN + >= min_full_reads whole-chain reads x none -> NOVEL_PROBABLE (confirmed / chain_support)
#   UNKNOWN + chain support x rt_switch -> NOVEL_PROBABLE (chain_support;rt_switch_sign; same for consensus)
#   UNKNOWN + chain support x noncanonical|degradation -> UNCONFIRMED (unconfirmed / chain_support_with_<mechanism>)
#   UNKNOWN otherwise       -> UNRESOLVED      (unconfirmed / no_short_reads | no_coverage |
#                                               no_novel_junction | caller_chain_absent)
# Before the grid: FSM -> KNOWN, ISM -> KNOWN_FRAGMENT (ism_chain_support) when >= min_full_reads
# whole-chain reads carry it and no intra-priming sign, else UNCONFIRMED (ism[_intrapriming|_rts]), other
# categories -> UNRESOLVED (not_adjudicated), reference-bias rescue -> REFERENCE_BIAS or,
# under circular-risk provenance, UNRESOLVED (firewall_held); junctions explained by
# different haplotypes/paths -> UNRESOLVED (haplotype_inconsistent / path_inconsistent).
