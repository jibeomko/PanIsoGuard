# PanIsoGuard default adjudication rules (auditable, runtime-loaded).
#
# This file makes the decision logic inspectable: the tunable thresholds below
# are read by the rule engine, and the (novelty-support x mechanism) -> class
# projection is documented in docs/decision_engine.md and echoed per-isoform in
# the `rule_trace` field of <prefix>.attribution.jsonl.
#
# Status: Tier-0 (SQANTI priors + short-read junction corroboration). Thresholds
# are conservative defaults, NOT yet calibrated on SQANTI-SIM (E1/E2); do not
# treat them as validated. Framing constraint: PanIsoGuard reports orthogonal
# attribution + confidence + provenance, never "beats" the SQANTI3 RF filter or
# FLAIR2.

[meta]
ruleset_version        = "default-0.0.1"
sqanti3_version_target = "6.0"   # QC-prior reconciliation target; pin & cite
random_seed            = 1

# --- Axis A: novelty support (engine-read) -----------------------------------
[axis_novelty_support]
sj_min_uniq_reads          = 3      # STAR SJ.tab n_uniq to corroborate a novel junction
sj_require_canonical_motif = true   # require SJ.tab motif code >= 1
consensus_min_callers      = 999    # multi-caller agreement gate; 999 disables (single-caller)

# --- Axis B: artifact mechanism (engine-read where noted) --------------------
# Priority order applied by the engine: noncanonical > rt_switch > degradation.
[axis_artifact.degradation]
max_perc_A_downstream_TTS = 60.0    # SQANTI3 intra-priming default: keep <60, flag >=60 (engine-read)

[axis_artifact.rt_switch]
use_sqanti_RTS_stage = true         # documented; engine uses SQANTI RTS_stage prior

[axis_artifact.noncanonical]
use_sqanti_all_canonical = true     # documented; engine uses SQANTI all_canonical prior

[axis_artifact.mapping]             # BAM read-level axis (engine-read; only when --bam supplied)
min_mapq               = 20         # spanning reads below this MAPQ count as low-confidence
softclip_min_bp        = 20         # terminal soft-clip >= this counts toward the soft-clip fraction
junction_window_bp     = 10         # indel proximity window around each splice boundary
max_low_mapq_frac      = 0.5        # > this fraction of low-MAPQ spanning reads -> mapping artifact
max_supplementary_frac = 0.5        # > this fraction supplementary/secondary -> mapping artifact

# --- Reference-bias rescue: pangenome (engine-read; only when --pangenome-junctions supplied)
# A novel-vs-linear-reference junction realizable on a pangenome graph haplotype
# path is reference bias, not new splicing. Population-level reference data, so it
# is non-circular and always allowed to promote.
[axis_pangenome]
min_haplotypes = 1                  # a novel junction must be on >= this many graph haplotypes to rescue

# --- Confidence classes ------------------------------------------------------
# Output classes (ordinal within the novel tiers). PAN_REF_RESCUED_FALSE_NOVEL is
# emitted only when the variant axis (--reference-haplotype) or the pangenome axis
# (--pangenome-junctions) is supplied; without them the run stays in the Tier-0
# grid (no rescue class).
[confidence]
classes = [
  "HIGH_CONF_KNOWN",
  "HIGH_CONF_NOVEL",
  "MEDIUM_CONF_NOVEL",
  "LOW_CONF_PARTIAL",
  "PAN_REF_RESCUED_FALSE_NOVEL",      # reference bias: explained by a personalized haplotype
                                      # (variant axis) or a pangenome graph path (pangenome axis)
  "AMBIGUOUS",
  "ARTIFACT",
]

# Projection grid implemented in src/core/rules.cpp (v1) and documented in
# docs/decision_engine.md:
#   SUPPORTED   x none      -> HIGH_CONF_NOVEL
#   SUPPORTED   x mechanism -> MEDIUM_CONF_NOVEL
#   PARTIAL     x none      -> MEDIUM_CONF_NOVEL
#   PARTIAL     x mechanism -> LOW_CONF_PARTIAL
#   UNSUPPORTED x none      -> LOW_CONF_PARTIAL
#   UNSUPPORTED x mechanism -> ARTIFACT
#   UNKNOWN (support not evaluable) -> AMBIGUOUS
# Moving the full grid into this file (table-driven projection) is a planned
# refinement.
